name: Toggle Orders Schedule

on:
    schedule:
        # Runs at 07:00 UTC (09:00 Kigali) and 07:30 UTC (09:30 Kigali) daily
        # These times ensure consistency by checking at both 9:00 and 9:30 Kigali time
        - cron: "0 7 * * *"
        - cron: "30 7 * * *"
    workflow_dispatch: {}

jobs:
    toggle:
        runs-on: ubuntu-latest
        steps:
            - name: Check out
              uses: actions/checkout@v4

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Install dependencies
              run: npm install

            - name: Toggle orders according to Kigali schedule
              env:
                  API_BASE_URL: ${{ secrets.API_BASE_URL }}
                  ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
              run: node scripts/toggle-orders-schedule.js
